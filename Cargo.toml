[package]
name = "fierro"
version = "0.1.0"
edition = "2024"
description = "Laptop hardware control for Linux: charge limits, profiles, fn-lock and more, a todo fierro"
license = "MIT"
repository = "https://github.com/daniiiqa/fierro"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
